name: Descargar ocupación aparcamientos Málaga

on:
  schedule:
    - cron: "7 * * * *"      # cada hora (minuto 7, UTC)
  workflow_dispatch:          # botón para lanzarlo a mano

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar CSV
        run: |
          URL="https://datosabiertos.malaga.eu/recursos/aparcamientos/ocupappublicosmun/ocupappublicosmun.csv"
          STAMP=$(TZ=Europe/Madrid date +%Y-%m-%d_%H%M)
          DIA=$(TZ=Europe/Madrid date +%Y-%m-%d)
          mkdir -p data/historico/$DIA
          curl -fsSL --retry 3 "$URL" -o data/ocupacion_actual.csv
          cp data/ocupacion_actual.csv "data/historico/$DIA/$STAMP.csv"

      - name: Guardar en el repositorio
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Datos $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
          git push
